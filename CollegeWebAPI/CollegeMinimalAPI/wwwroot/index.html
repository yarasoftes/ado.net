<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College DB | Панель управления</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        .bg-shape { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; opacity: 0.6; }
        .shape-1 { width: 400px; height: 400px; background: #4f46e5; top: -100px; left: -100px; }
        .shape-2 { width: 300px; height: 300px; background: #ec4899; bottom: -50px; right: -50px; }

        .container {
            position: relative; z-index: 1; width: 100%; max-width: 900px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header { text-align: center; margin-bottom: 20px; }
        h1 {
            font-size: 2.5rem; font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p.subtitle { color: #94a3b8; font-size: 1rem; }

        /* Стили для кнопок вкладок */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .tab-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 10px 20px; border-radius: 12px; cursor: pointer;
            font-size: 1rem; transition: 0.3s; font-family: 'Montserrat', sans-serif;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .tab-btn.active { background: #4f46e5; border-color: #818cf8; box-shadow: 0 0 15px rgba(79, 70, 229, 0.5); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 12px; margin-top: 10px; }
        th { text-align: left; padding: 15px 20px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        
        tbody tr {
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out forwards; opacity: 0;
        }
        tbody tr:hover { background: rgba(255, 255, 255, 0.08); transform: scale(1.01) translateX(5px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        td { padding: 20px; font-size: 1.05rem; }
        td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; font-weight: bold; color: #c084fc; }
        td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; font-weight: 600; }

        .badge { display: inline-block; padding: 6px 12px; background: rgba(79, 70, 229, 0.2); color: #a5b4fc; border-radius: 20px; font-size: 0.85rem; border: 1px solid rgba(79, 70, 229, 0.3); }
        
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(129, 140, 248, 0.2); border-top: 4px solid #818cf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #f87171 !important; text-align: center; margin-top: 20px; font-weight: bold;}
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="container">
        <div class="header">
            <h1>College Database</h1>
            <p class="subtitle">Визуализация данных из ASP.NET Core API</p>
        </div>

        <!-- Кнопки переключения вкладок -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('groupsTab', this)">Группы</button>
            <button class="tab-btn" onclick="openTab('studentsTab', this)">Студенты</button>
        </div>
        
        <!-- Вкладка с группами -->
        <div id="groupsTab" class="tab-content active">
            <table>
                <thead>
                    <tr><th>ID Группы</th><th>Название группы</th></tr>
                </thead>
                <tbody id="groupsBody">
                    <tr><td colspan="2"><div class="spinner"></div></td></tr>
                </tbody>
            </table>
        </div>

        <!-- Вкладка со студентами -->
        <div id="studentsTab" class="tab-content">
            <table>
                <thead>
                    <tr><th>ID Студента</th><th>ФИО</th><th>ID Группы</th></tr>
                </thead>
                <tbody id="studentsBody">
                    <tr><td colspan="3"><div class="spinner"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Функция для переключения вкладок
        function openTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');
        }

        // Загрузка групп из API
        fetch('/api/groups')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('groupsBody');
                tbody.innerHTML = '';
                data.forEach(group => {
                    tbody.innerHTML += `<tr><td>#${group.id}</td><td><span class="badge">${group.name}</span></td></tr>`;
                });
            }).catch(err => document.getElementById('groupsBody').innerHTML = `<tr><td colspan="2" class="error">Ошибка: ${err}</td></tr>`);

        // Загрузка студентов из API (Пункт 6)
        fetch('/api/students/all')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('studentsBody');
                tbody.innerHTML = '';
                data.forEach(student => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${student.id}</td>
                            <td>${student.fullName}</td>
                            <td><span class="badge">Группа ${student.groupId}</span></td>
                        </tr>`;
                });
            }).catch(err => document.getElementById('studentsBody').innerHTML = `<tr><td colspan="3" class="error">Ошибка: ${err}</td></tr>`);
    </script>

</body>
</html>

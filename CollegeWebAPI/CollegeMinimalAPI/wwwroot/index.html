<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College DB | Панель управления</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Красивые светящиеся шары на фоне */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            background: #4f46e5;
            top: -100px;
            left: -100px;
        }
        .shape-2 {
            width: 300px;
            height: 300px;
            background: #ec4899;
            bottom: -50px;
            right: -50px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 15px 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tbody tr {
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
        }

        /* Задержка анимации для каждой строки */
        tbody tr:nth-child(1) { animation-delay: 0.1s; }
        tbody tr:nth-child(2) { animation-delay: 0.2s; }
        tbody tr:nth-child(3) { animation-delay: 0.3s; }
        tbody tr:nth-child(4) { animation-delay: 0.4s; }
        tbody tr:nth-child(5) { animation-delay: 0.5s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.01) translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        td {
            padding: 20px;
            font-size: 1.05rem;
        }

        td:first-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            font-weight: bold;
            color: #c084fc;
        }

        td:last-child {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(79, 70, 229, 0.2);
            color: #a5b4fc;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(79, 70, 229, 0.3);
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #818cf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(129, 140, 248, 0.2);
            border-top: 4px solid #818cf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #f87171 !important;
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="container">
        <div class="header">
            <h1>College Database</h1>
            <p class="subtitle">Визуализация данных из ASP.NET Core API</p>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <span>Загрузка данных из базы...</span>
        </div>

        <table id="groupsTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID Группы</th>
                    <th>Название группы</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Сюда будут вставляться данные -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/groups')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Ошибка при запросе к API');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('groupsTable').style.display = 'table';
                    
                    const tableBody = document.getElementById('tableBody');
                    
                    data.forEach(group => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>#${group.id}</td>
                            <td><span class="badge">${group.name}</span></td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    const loading = document.getElementById('loading');
                    loading.className = 'error';
                    loading.innerHTML = `❌ Ошибка: ${error.message}`;
                });
        });
    </script>

</body>
</html>
